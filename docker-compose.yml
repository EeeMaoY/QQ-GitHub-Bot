version: "3"
services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    environment:
      - TZ=Asia/Shanghai
      - REDIS_PASSWORD=${REDIS_PASSWORD:?err}
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    volumes:
      - bot_redis_data:/data
    restart: always

  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - POSTGRES_INITDB_ARGS="--encoding=UTF8"
      - TZ=Asia/Shanghai
    volumes:
      - bot_postgres_data:/var/lib/postgresql/data
    restart: always

  nonebot:
    build: . # build image from local source
    # image: cscs181/qq-github-bot:latest # use prebuilt image instead of build
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - ENVIRONMENT=prod
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8086}
      - MAX_WORKERS=1 # maximum workers
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports: 
      - "8086:8086"
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      # 镜像里没有 curl/wget，只有 python，故用 urllib 探测
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:${PORT:-8086}/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  go-cqhttp:
    image: ghcr.io/mrs4s/go-cqhttp:latest
    volumes:
      - "./bot:/data"
    depends_on:
      - nonebot
    restart: always
    profiles:
      - go-cqhttp
volumes:
  bot_redis_data: {}
  bot_postgres_data: {}
